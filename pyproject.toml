[project]
name = "guidely"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rouwel", email = "rouwelngacha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
guidely = "guidely:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# B008 is a false positive for FastAPI: `File(...)`/`Depends(...)` in an argument
# default is the framework's documented pattern.
ignore = ["B008"]

[dependency-groups]
dev = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.53.0",
]
